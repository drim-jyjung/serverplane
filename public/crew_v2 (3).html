<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>✈ 비행기방</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F4FF;--surface:#fff;--border:#DDEAFF;
  --text:#111827;--text2:#6B7280;--text3:#B0BBCF;
  --primary:#1A6BFF;--primary-dark:#0052D4;
  --grad:linear-gradient(135deg,#1A6BFF,#0EA5E9);
  --green:#059669;--green-bg:#ECFDF5;
  --amber:#D97706;--amber-bg:#FFFBEB;
  --red:#DC2626;--red-bg:#FEF2F2;
  --purple:#7C3AED;--purple-bg:#F5F3FF;
  --r:16px;--rsm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:-webkit-fill-available;height:100%}
body{
  font-family:Pretendard,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  max-width:430px;margin:0 auto;
  min-height:100vh;min-height:-webkit-fill-available;min-height:100dvh;
}
.page{display:none;flex-direction:column;position:fixed;inset:0;overflow:hidden}
.page.active{display:flex}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:50
}
.topbar-logo{font-size:19px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.warn-top{background:var(--amber-bg);border-bottom:1px solid #FFD580;padding:10px 16px;font-size:12px;color:var(--amber);font-weight:600;display:none;flex-shrink:0}
.warn-top.show{display:block}
.content{flex:1;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.ticket-layout{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
  overflow:hidden;
  background:var(--bg);
}
.ticket-scroll{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  min-height:0;
  background:var(--bg);
}
.room-info-card{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:14px 16px;
}
.p-section-header{
  padding:8px 16px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;
}
.my-section{
  flex-shrink:0;
  border-top:2px solid var(--border);
  padding:14px 16px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--surface);
  box-shadow:0 -4px 16px rgba(0,0,0,.07);
  max-height:55vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;font-family:inherit;font-size:14px;font-weight:600;padding:10px 18px;border-radius:var(--rsm);border:none;cursor:pointer;transition:opacity .15s;width:100%}
.btn:active{opacity:.8}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-grad{background:var(--grad);color:#fff}
.btn-primary{background:var(--primary);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:6px 14px;font-size:12px;width:auto;border-radius:6px}
.input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);outline:none;transition:border-color .15s}
.input:focus{border-color:var(--primary)}.input::placeholder{color:var(--text3)}
select.input{cursor:pointer}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-blue{background:#EFF9FF;color:var(--primary)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-gray{background:#F5F5F5;color:var(--text2)}
.tag{display:inline-flex;font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:#F0F0F0;color:var(--text2);margin:2px}
.banner{padding:11px 14px;border-radius:var(--rsm);font-size:13px;margin-bottom:14px;display:none}
.banner.show{display:block}
.banner-error{background:var(--red-bg);color:var(--red);border:1px solid #F7C5CA}
.banner-ok{background:var(--green-bg);color:var(--green);border:1px solid #A3E4C9}
.sp{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
.sp-dark{border-color:var(--border);border-top-color:var(--primary)}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.room-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:16px;
  margin-bottom:10px;
  cursor:pointer;
  position:relative;overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.room-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.room-card:active{opacity:.85}
.room-card.disabled{opacity:.6;cursor:not-allowed}
.room-card.mine{border-color:#93C5FD}
.p-row{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
.p-row:last-child{border-bottom:none}
.av{width:32px;height:32px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.my-label{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.my-block{border:1px solid var(--border);border-radius:var(--rsm);overflow:hidden;margin-bottom:8px;background:var(--surface)}
.my-block:last-child{margin-bottom:0}
.my-row{padding:12px 14px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--border)}
.my-row:last-child{border-bottom:none}
.my-row-label{font-size:13px;font-weight:600;margin-bottom:2px}
.my-row-sub{font-size:11px;color:var(--text3)}
.link-box{font-size:12px;color:var(--primary);word-break:break-all;padding:8px 10px;background:#EFF9FF;border-radius:6px;margin-top:6px;border:1px solid #BFDBFE}
.empty{text-align:center;padding:48px 20px;color:var(--text3);font-size:13px}
.login-wrap{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));
}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;width:100%;max-width:360px}
.plane-anim{font-size:52px;display:block;animation:fly 3s ease-in-out infinite;margin-bottom:8px;text-align:center}
@keyframes fly{0%{transform:translateX(-6px) rotate(-4deg)}50%{transform:translateX(6px) rotate(4deg)}100%{transform:translateX(-6px) rotate(-4deg)}}
.land-bar{height:5px;background:rgba(0,0,0,.08);border-radius:3px;overflow:hidden;margin-top:6px}
.land-bar-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
.fly-plane{position:fixed;top:30%;left:-80px;font-size:38px;z-index:999;animation:flyAcross 1.2s ease-in-out forwards;pointer-events:none;display:none}
@keyframes flyAcross{from{left:-80px;opacity:1}to{left:calc(100vw + 80px);opacity:.5}}
</style>
</head>
<body>

<div class="fly-plane" id="fly-plane">✈️</div>

<div class="page active" id="page-login">
  <div class="login-wrap">
    <div style="text-align:center;margin-bottom:28px">
      <span class="plane-anim">✈️</span>
      <div style="font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent">비행기방</div>
      <div style="font-size:13px;color:var(--text2);margin-top:4px">@jjoycrew_official</div>
    </div>
    <div class="login-card">
      <div id="login-error" class="banner banner-error"></div>
      <div style="margin-bottom:12px">
        <label style="font-size:12px;font-weight:700;color:var(--text2);display:block;margin-bottom:5px">닉네임</label>
        <input class="input" id="inp-nick" placeholder="닉네임" autocomplete="off">
      </div>
      <div style="margin-bottom:14px">
        <label style="font-size:12px;font-weight:700;color:var(--text2);display:block;margin-bottom:5px">인스타 아이디 (@ 제외)</label>
        <input class="input" id="inp-insta" placeholder="instagram_id" autocomplete="off" autocapitalize="none">
      </div>
      <button class="btn btn-grad" id="btn-login">입장하기 ✈</button>
    </div>
    <div style="font-size:12px;color:var(--text3);text-align:center;margin-top:14px">계정 등록은 관리자에게 문의하세요</div>
  </div>
</div>

<div class="page" id="page-rooms">
  <div class="topbar" style="flex-shrink:0">
    <div class="topbar-logo">✈ 비행기방</div>
    <div style="display:flex;align-items:center;gap:6px">
      <span id="rooms-user" style="font-size:12px;color:var(--text2)"></span>
      <span id="rooms-badges" style="display:flex;gap:4px;align-items:center"></span>
      <button class="btn btn-outline btn-sm" id="btn-logout">로그아웃</button>
    </div>
  </div>
  <div id="warn-top-rooms" class="warn-top"></div>
  <div id="ticket-info-bar" style="display:none;padding:6px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;flex-direction:column"></div>
  <div class="content" style="background:var(--bg)">
    <div id="rooms-error" class="banner banner-error"></div>
    <div id="rooms-list"><div class="empty"><span class="sp sp-dark" style="width:24px;height:24px"></span></div></div>
  </div>
</div>

<div class="page" id="page-ticket">
  <div class="topbar" style="flex-shrink:0">
    <button class="btn btn-outline btn-sm" style="width:auto" id="btn-back">← 목록</button>
    <div id="ticket-title" style="font-size:14px;font-weight:700"></div>
    <span id="ticket-badge" class="badge"></span>
  </div>

  <div id="warn-top-ticket" class="warn-top"></div>

  <div class="ticket-layout">

    <div class="ticket-scroll">
      <div class="room-info-card">
        <div id="ticket-time" style="font-size:12px;color:var(--text2);margin-bottom:6px"></div>
        <div id="ticket-items" style="margin-bottom:6px"></div>
        <div id="ticket-memo" style="font-size:12px;color:var(--text2);white-space:pre-line;background:var(--bg);border-radius:8px;padding:10px 12px;display:none;line-height:1.7;margin-top:4px"></div>
      </div>
      <div class="p-section-header">
        <span id="p-count" style="font-size:12px;font-weight:700;color:var(--text2)">참여자 목록</span>
        <button class="btn btn-outline btn-sm" id="btn-copy-all">전체 복사</button>
      </div>
      <div id="p-list" style="background:var(--surface);margin:8px 12px;border-radius:var(--r);border:1px solid var(--border);overflow:hidden">
        <div class="empty" style="padding:20px"><span class="sp sp-dark" style="width:20px;height:20px"></span></div>
      </div>
    </div>

    <div class="my-section">
      <div class="my-label">내 참여</div>
      <div id="my-part"></div>
    </div>

  </div>
</div>

<script>
// ══════════════════════════════════════════════
// ★ 수정 필요: 배포 URL
// ══════════════════════════════════════════════
const API = 'https://script.google.com/macros/s/AKfycbwsirJW4Gq3V_mUqeY8L_Fg-d77nkb4FTuOL3nu1IOSJIaAJ68H2Cj4HUNWjzbu8NjLOg/exec';

const SK = 'plane_crew_v2';
const SK_CRED = 'plane_crew_cred';
let me = null, currentRoom = null, participants = [], weekLandCount = 0, todayParticipated = false;

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => {
    const el = document.activeElement;
    if (el && (el.tagName==='INPUT'||el.tagName==='SELECT'))
      setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),100);
  });
}

const saveS  = d => { try { sessionStorage.setItem(SK, JSON.stringify(d)); } catch(e){} };
const loadS  = ()=> { try { return JSON.parse(sessionStorage.getItem(SK)); } catch(e){ return null; } };
const clearS = ()=> { try { sessionStorage.removeItem(SK); } catch(e){} };

// ── API — 실패 시(네트워크 유실 등) 1회 자동 재시도.
// 크루의 모든 액션(탑승/착륙/링크등록/수정)은 서버에 이미 "중복 방지" 체크가 있어서
// (같은 유형 중복탑승 차단, 이미 착륙완료면 에러, 이미 링크 등록되어있으면 에러 등)
// 재시도해도 실제로 두 번 처리될 위험이 없음 — 그래서 크루 쪽은 전체 재시도가 안전함.
async function api(action, body={}, _retry=true) {
  try {
    const r = await fetch(API, {method:'POST', body:JSON.stringify({...body, action})});
    return await r.json();
  } catch(e) {
    if (_retry) {
      await new Promise(resolve => setTimeout(resolve, 700));
      return api(action, body, false);
    }
    return {ok:false, error:'네트워크 오류'};
  }
}

const showPage = id => { document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); };
const showBnr  = (id,msg,type='error') => { const el=document.getElementById(id); if(!el)return; el.className=`banner banner-${type==='ok'?'ok':'error'} show`; el.textContent=msg; if(type==='ok') setTimeout(()=>el.classList.remove('show'),3000); };
const hideBnr  = id => document.getElementById(id)?.classList.remove('show');
const letter   = n => n?n[0]:'?';
const fly      = () => { const el=document.getElementById('fly-plane'); el.style.display='block'; setTimeout(()=>el.style.display='none',1300); };

function parseKST(str) {
  if (!str) return new Date(0);
  const s = String(str).trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/);
  return m ? new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:00+09:00`) : new Date(s);
}
function fmt(s) {
  if (!s||s==='-') return '-';
  try {
    const now = new Date();
    const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    const d = new Date(String(s).replace(' ','T')+':00+09:00');
    if (isNaN(d)) return String(s).substring(0,16);
    const h = d.getHours(), m = d.getMinutes();
    const ampm = h < 12 ? '오전' : '오후';
    const h12 = h === 0 ? 12 : h > 12 ? h-12 : h;
    const timeStr = m === 0 ? `${ampm} ${h12}시` : `${ampm} ${h12}시 ${m}분`;
    const dStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const nowDate = new Date(todayStr+'T00:00:00+09:00');
    const tgtDate = new Date(dStr+'T00:00:00+09:00');
    const diffDay = Math.round((tgtDate - nowDate) / 86400000);
    if (diffDay === 0)  return timeStr;
    if (diffDay === 1)  return `내일 ${timeStr}`;
    if (diffDay === -1) return `어제 ${timeStr}`;
    return `${d.getMonth()+1}/${d.getDate()} ${timeStr}`;
  } catch(e){ return String(s).substring(0,16); }
}
function expiryExcellent(grantedAt) {
  try { const d=new Date(String(grantedAt).substring(0,10)+'T00:00:00+09:00'); d.setDate(d.getDate()+1); return `${d.getMonth()+1}/${d.getDate()} 10:00`; } catch(e){ return '내일 10:00'; }
}
function expiryHonorary(grantedAt) {
  try {
    const d=new Date(String(grantedAt).substring(0,10)+'T00:00:00+09:00');
    const day=d.getDay(), toSun=day===0?0:7-day;
    const sun=new Date(d.getTime()+toSun*86400000);
    return `${sun.getMonth()+1}/${sun.getDate()} 22:00`;
  } catch(e){ return '일요일 22:00'; }
}

function extractUrl(text) {
  if (!text) return '';
  const m = String(text).match(/https?:\/\/[^\s]+/);
  if (!m) return '';
  let url = m[0];
  const koreanIdx = url.search(/[가-힣]/);
  if (koreanIdx > -1) url = url.substring(0, koreanIdx);
  url = url.replace(/[),.!?;:'"”’]+$/,'');
  return url;
}

document.getElementById('btn-login').addEventListener('click', doLogin);
document.getElementById('btn-logout').addEventListener('click', doLogout);
document.getElementById('btn-back').addEventListener('click', goRooms);
document.getElementById('btn-copy-all').addEventListener('click', copyAll);
['inp-nick','inp-insta'].forEach(id => document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); }));
document.getElementById('my-part').addEventListener('click', e => {
  const btn = e.target.closest('button[data-action]'); if(!btn) return;
  const a = btn.dataset.action;
  if (a==='ticket') doTicketFromUI();
  if (a==='land')      doLand(btn);
  if (a==='link-reg')  doRegisterLink(btn);
  if (a==='link-edit') doUpdateLink(btn);
});
document.getElementById('rooms-list').addEventListener('click', e => {
  const card = e.target.closest('.room-card'); if(!card||card.classList.contains('disabled')) return;
  goTicket(card.dataset.rid);
});

window.addEventListener('load', () => {
  const s = loadS();
  if (s?.member_id) { me=s; goRooms(); return; }
  try {
    const cred = JSON.parse(localStorage.getItem(SK_CRED)||'null');
    if (cred?.nickname && cred?.insta_id) {
      document.getElementById('inp-nick').value = cred.nickname;
      document.getElementById('inp-insta').value = cred.insta_id;
      doLogin();
    }
  } catch(e) {}
});

async function doLogin() {
  const nick=document.getElementById('inp-nick').value.trim();
  const insta=document.getElementById('inp-insta').value.trim();
  hideBnr('login-error');
  if (!nick||!insta) { showBnr('login-error','닉네임과 인스타 아이디를 입력해주세요'); return; }
  const btn=document.getElementById('btn-login');
  btn.disabled=true; btn.innerHTML='<span class="sp"></span>';
  try {
    const d = await api('login',{nickname:nick,insta_id:insta});
    if (!d.ok) { showBnr('login-error', d.error==='locked'?'🔒 '+d.message : d.error||'로그인 실패'); return; }
    try { localStorage.setItem(SK_CRED, JSON.stringify({nickname:nick, insta_id:insta})); } catch(e){}
    clearS(); me=d.member; saveS(me);
    fly(); setTimeout(goRooms, 400);
  } catch(e) { showBnr('login-error','서버 연결 실패'); }
  finally { btn.disabled=false; btn.innerHTML='입장하기 ✈'; }
}

function doLogout() {
  me=null; currentRoom=null; participants=[];
  clearS();
  try { localStorage.removeItem(SK_CRED); } catch(e){}
  showPage('page-login');
  document.getElementById('inp-nick').value='';
  document.getElementById('inp-insta').value='';
}

function _renderTopBadges() {
  const bdg=document.getElementById('rooms-badges');
  if (!bdg) return;
  const badges=[];
  if (me?.warning_count>0) badges.push(`<span style="font-size:11px;font-weight:700;background:var(--red-bg);color:var(--red);padding:2px 7px;border-radius:20px;white-space:nowrap">⚠️ ${me.warning_count}회</span>`);
  if (me?.honorary_count>0) badges.push(`<span style="font-size:11px;font-weight:700;background:var(--purple-bg);color:var(--purple);padding:2px 7px;border-radius:20px;white-space:nowrap">🏅 ${me.honorary_count}</span>`);
  if (me?.excellent_count>0) badges.push(`<span style="font-size:11px;font-weight:700;background:var(--primary-light);color:var(--primary);padding:2px 7px;border-radius:20px;white-space:nowrap">⭐ ${me.excellent_count}</span>`);
  bdg.innerHTML=badges.join('');
}

let warnListOpen = false;
function _renderWarnBanner() {
  const wb = document.getElementById('warn-top-rooms');
  if (!wb) return;
  if (!me?.is_warned) { wb.className='warn-top'; wb.innerHTML=''; warnListOpen=false; return; }
  wb.className='warn-top show';
  const warnings = me.warnings || [];
  const summary = `⚠️ 경고 ${me.warning_count||1}회 보유 · 만료: ${me.warn_expires||'익일 10:00'} · 경고 보유 시 탑승 불가${warnings.length?' <span style="text-decoration:underline">(내역 보기)</span>':''}`;
  const listHtml = (warnListOpen && warnings.length) ? `
    <div style="margin-top:8px;background:#fff;border-radius:8px;overflow:hidden;border:1px solid #FFD580">
      ${warnings.map(w=>`
        <div class="warn-item" data-rid="${w.room_id||''}" style="padding:8px 10px;border-bottom:1px solid #FFF3D6;font-weight:400;${w.room_id?'cursor:pointer':''}">
          <div style="font-size:12px;font-weight:700;color:var(--text)">${w.room_date?`${w.room_date} #${w.room_number}`:'(방 정보 없음 — 관리자 수동경고)'}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px">${w.reason||''}</div>
          ${w.room_id?'<div style="font-size:11px;color:var(--primary);margin-top:2px">👉 눌러서 참여자·링크 보기</div>':''}
        </div>`).join('')}
    </div>` : '';
  wb.innerHTML = `<div id="warn-summary">${summary}</div>${listHtml}`;
}
document.getElementById('warn-top-rooms').addEventListener('click', e=>{
  const item = e.target.closest('.warn-item');
  if (item) {
    if (item.dataset.rid) goTicket(item.dataset.rid);
    return;
  }
  warnListOpen = !warnListOpen;
  _renderWarnBanner();
});

async function goRooms() {
  showPage('page-rooms');

  if (me?.nickname && me?.insta_id && me?.member_id) {
    setTimeout(function(){
      api('login', {nickname: me.nickname, insta_id: me.insta_id}).then(function(fresh){
        if (fresh?.ok && fresh.member && fresh.member.member_id === me.member_id) {
          me = fresh.member;
          saveS(me);
          _renderTopBadges();
          _renderWarnBanner();
        }
      }).catch(function(){});
    }, 1500);
  }

  document.getElementById('rooms-user').textContent = me?`@${me.insta_id}`:'';
  _renderTopBadges();
  _renderWarnBanner();

  const ib=document.getElementById('ticket-info-bar');
  if (ib) ib.style.display='none';

  hideBnr('rooms-error');
  document.getElementById('rooms-list').innerHTML='<div class="empty"><span class="sp sp-dark" style="width:24px;height:24px"></span></div>';
  try {
    const d = await api('get_rooms', {member_id: me?.member_id});
    renderRooms(d.rooms||[]);
  } catch(e) { showBnr('rooms-error','룸 목록을 불러오지 못했습니다'); document.getElementById('rooms-list').innerHTML=''; }
}

function renderRooms(rooms) {
  const el=document.getElementById('rooms-list');
  const isWarned=!!me?.is_warned;
  if (!rooms.length) {
    el.innerHTML=`<div class="empty" style="padding-top:60px"><div style="font-size:40px;margin-bottom:12px">✈️</div>오늘 개설된 비행기가 없습니다<br><span style="font-size:12px;margin-top:6px;display:block">잠시 후 다시 확인해주세요</span></div>`;
    return;
  }
  const now=new Date();
  const ttIcon={excellent:'⭐',honorary:'🏅',staff:'🎖',normal:''};
  el.innerHTML=rooms.map(r=>{
    const ts=parseKST(r.ticket_start), te=parseKST(r.ticket_end);
    const ls=parseKST(r.land_start),   le=parseKST(r.land_end);

    const beforeTicket = now < ts;
    const inTicket     = now >= ts && now < te;
    const inLand       = now >= ls && now < le;
    const afterAll     = now >= le;
    const showLanding  = now >= te && now < le;

    let badge, canEnter=true;
    if      (beforeTicket){ badge='<span class="badge badge-gray">입장 대기 ⏳</span>'; canEnter=false; }
    else if (inTicket)    { badge='<span class="badge badge-green">🎫 티켓팅 중</span>'; }
    else if (showLanding) { badge='<span class="badge badge-blue">🛬 착륙 중</span>'; }
    else                  { badge='<span class="badge badge-red">🔒 마감</span>'; }
    if (isWarned && inTicket) canEnter=false;

    const myIcon = ttIcon[r.my_ticket_type||'normal']||'';
    const myBadge = r.my_status === 'landed'
      ? `<span class="badge badge-green">✅ 참여완료${myIcon?' '+myIcon:''}</span>`
      : r.my_status === 'ticketed'
        ? `<span class="badge badge-blue">🎫 탑승중${myIcon?' '+myIcon:''}</span>`
        : '';

    const tags=(r.items||'').split(',').map(t=>`<span class="tag">${t.trim()}</span>`).join('');
    const maxLabel=Number(r.max_members)>=9999?'무제한':r.max_members;

    let countLine='';
    if (showLanding || afterAll) {
      const landed = r.landed_count ?? 0;
      const bg = afterAll ? '#F5F5F5' : 'var(--green-bg)';
      countLine=`<div style="margin-top:8px;padding:8px 10px;background:${bg};border-radius:8px;font-size:13px;font-weight:700">
        <span style="color:var(--green)">착륙완료 ${landed}명</span> / 탑승 ${r.joined}명
      </div>`;
    } else if (!beforeTicket) {
      countLine=`<div style="font-size:12px;color:var(--text2);margin-top:6px">👥 ${r.joined}/${maxLabel}명</div>`;
    }
    return `<div class="room-card${canEnter?'':' disabled'}${r.my_status?' mine':''}" data-rid="${r.room_id}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <div style="font-size:15px;font-weight:700">${String(r.room_date).substring(0,10)} #${r.room_number}</div>
        <div style="display:flex;gap:4px;align-items:center">${badge}${myBadge}</div>
      </div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:6px">🎫 ${r.ticket_start_fmt||fmt(r.ticket_start)} ~ ${r.ticket_end_fmt||fmt(r.ticket_end)} &nbsp; 🛬 ${r.land_start_fmt||fmt(r.land_start)} ~ ${r.land_end_fmt||fmt(r.land_end)}</div>
      <div>${tags}</div>
      ${countLine}
      ${beforeTicket?`<div style="font-size:11px;color:var(--text3);margin-top:5px">⏳ ${r.ticket_start_fmt||fmt(r.ticket_start)} 부터 입장 가능</div>`:''}
      ${isWarned&&canEnter===false&&!beforeTicket?`<div style="font-size:11px;color:var(--red);margin-top:5px;font-weight:600">🚫 경고 보유 중 — 탑승 불가</div>`:''}
    </div>`;
  }).join('');
}

async function goTicket(roomId) {
  if (!me?.member_id) { clearS(); me=null; showPage('page-login'); return; }
  currentRoom=null; participants=[];
  showPage('page-ticket');
  document.getElementById('ticket-title').textContent='';
  document.getElementById('ticket-badge').className='badge';
  document.getElementById('ticket-badge').textContent='';
  document.getElementById('ticket-time').innerHTML='';
  document.getElementById('ticket-items').innerHTML='';
  document.getElementById('ticket-memo').style.display='none';
  document.getElementById('p-count').textContent='참여자 목록';
  document.getElementById('p-list').innerHTML='<div class="empty" style="padding:20px"><span class="sp sp-dark" style="width:20px;height:20px"></span></div>';
  document.getElementById('my-part').innerHTML='';
  const wt=document.getElementById('warn-top-ticket');
  wt.innerHTML=me?.is_warned?`⚠️ 경고 ${me.warning_count||1}회 · 만료: ${me.warn_expires||'익일 10:00'}`:'';
  wt.classList.toggle('show',!!me?.is_warned);

  const detailRes = await api('get_room_detail',{room_id:roomId, member_id:me.member_id});
  weekLandCount = detailRes.ok && detailRes.my_week ? (detailRes.my_week.week_land_count||0) : 0;
  todayParticipated = detailRes.ok && detailRes.my_week ? !!detailRes.my_week.today_participated : false;
  if (!detailRes.ok) {
    document.getElementById('p-list').innerHTML='<div class="empty">불러오기 실패</div>'; return;
  }
  const data=detailRes;
  currentRoom=data.room; participants=data.participants||[];

  document.getElementById('ticket-title').textContent=`${String(currentRoom.room_date).substring(0,10)} #${currentRoom.room_number}`;

  const now=new Date();
  const ts=parseKST(currentRoom.ticket_start), te=parseKST(currentRoom.ticket_end);
  const ls=parseKST(currentRoom.land_start),   le=parseKST(currentRoom.land_end);
  const beforeTicket = now < ts;
  const inTicket     = now >= ts && now < te;
  const showLanding  = now >= te && now < le;
  const inLand       = now >= ls && now < le;
  const afterAll     = now >= le;

  const badge=document.getElementById('ticket-badge');
  if      (beforeTicket) { badge.className='badge badge-gray';  badge.textContent='입장 대기 ⏳'; }
  else if (inTicket)     { badge.className='badge badge-green'; badge.textContent='🎫 티켓팅 중'; }
  else if (showLanding)  { badge.className='badge badge-blue';  badge.textContent='🛬 착륙 중'; }
  else                   { badge.className='badge badge-red';   badge.textContent='🔒 마감'; }

  document.getElementById('ticket-time').innerHTML=
    `<span style="color:var(--primary);font-weight:600">🎫</span> ${currentRoom.ticket_start_fmt||fmt(currentRoom.ticket_start)} ~ ${currentRoom.ticket_end_fmt||fmt(currentRoom.ticket_end)} &nbsp;`+
    `<span style="color:var(--green);font-weight:600">🛬</span> ${currentRoom.land_start_fmt||fmt(currentRoom.land_start)} ~ ${currentRoom.land_end_fmt||fmt(currentRoom.land_end)}`;
  document.getElementById('ticket-items').innerHTML=(currentRoom.items||'').split(',').map(t=>`<span class="tag">${t.trim()}</span>`).join('');
  const memoEl=document.getElementById('ticket-memo');
  if (currentRoom.memo) { memoEl.textContent=currentRoom.memo; memoEl.style.display='block'; }

  const landed=participants.filter(p=>p.status==='landed').length;
  document.getElementById('p-count').textContent = (showLanding||afterAll)
    ? `참여자 (${participants.length}명) · 착륙완료 ${landed}명`
    : `참여자 (${participants.length}명)`;

  renderParticipants();
  renderMyPart(beforeTicket, inTicket, showLanding, inLand, afterAll);
}

function renderParticipants() {
  const el=document.getElementById('p-list');
  if (!participants.length) { el.innerHTML='<div class="empty" style="padding:20px;font-size:12px">아직 참여자가 없습니다</div>'; return; }
  const icon={excellent:'⭐',honorary:'🏅',staff:'🎖',normal:''};
  const sorted=[...participants].sort((a,b)=>(a.ticket_at||'').localeCompare(b.ticket_at||''));
  el.innerHTML=sorted.map((p,i)=>{
    const isMe=me&&p.member_id===me.member_id;
    const sb=p.status==='landed'?'<span class="badge badge-green" style="font-size:10px">착륙✓</span>':'<span class="badge badge-blue" style="font-size:10px">탑승</span>';
    return `<div class="p-row" style="${isMe?'background:#F0F7FF':''}">
      <div class="av" style="font-size:10px;font-weight:700;position:relative">
        ${letter(p.nickname)}
        <span style="position:absolute;top:-4px;left:-4px;background:#6366F1;color:#fff;font-size:9px;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center">${i+1}</span>
      </div>
      <div style="flex:1;margin-left:10px;min-width:0">
        <div style="font-size:13px;font-weight:600">${p.nickname}${isMe?' <span style="font-size:10px;color:var(--primary)">(나)</span>':''} ${icon[p.ticket_type||'normal']||''} ${sb}</div>
        <div style="font-size:11px;color:var(--text3)">@${p.insta_id}</div>
        ${p.post_url?`<div style="margin-top:2px"><a href="${p.post_url}" target="_blank" style="font-size:11px;color:var(--primary);word-break:break-all">${p.post_url}</a></div>`:'<div style="font-size:11px;color:var(--text3);margin-top:1px">링크 미등록</div>'}
      </div>
    </div>`;
  }).join('');
}

      </div>

  }

  if (afterAll) {
    el.innerHTML=`<div class="my-block">
      <div class="my-row" style="background:var(--red-bg)">
        <div><div class="my-row-label" style="color:var(--red)">🔒 착륙 마감</div>
        <div class="my-row-sub">${myPart?'착륙하지 않아 경고가 부여될 수 있습니다':'참여하지 않은 룸입니다'}</div></div>
      </div>

    const linkSection=hasLink
      ?`<div class="link-box">${myPart.post_url}</div>${inTicket?`<div style="margin-top:8px;display:flex;gap:6px"><input class="input" id="inp-link-edit" value="${myPart.post_url}" placeholder="새 링크" style="flex:1;font-size:12px;padding:8px 10px"><button class="btn btn-outline btn-sm" data-action="link-edit">수정</button></div>`:'<div class="my-row-sub" style="margin-top:4px">티켓팅 시간 내에만 수정 가능</div>'}`
      :(inTicket?`<div style="margin-top:8px;display:flex;gap:6px"><input class="input" id="inp-link" placeholder="https://instagram.com/p/..." style="flex:1;font-size:12px;padding:8px 10px"><button class="btn btn-primary btn-sm" data-action="link-reg">등록</button></div>`:'<div class="my-row-sub" style="margin-top:4px;color:var(--amber)">⚠ 티켓팅 마감 — 링크 등록 불가</div>');
    el.innerHTML=`<div class="my-block">
      <div class="my-row"><div style="flex:1"><div class="my-row-label">🔗 내 링크</div>${linkSection}</div></div>
      ${inLand?`<div class="my-row" style="background:var(--green-bg)">
        <div><div class="my-row-label" style="color:var(--green)">착륙 시간이에요!</div><div class="my-row-sub">품앗이 완료 후 눌러주세요</div></div>
        <button class="btn btn-green btn-sm" data-action="land">착륙 ✓</button>

        <div><div class="my-row-label" style="color:var(--amber)">⏳ 착륙 시작 전</div>
        <div class="my-row-sub">착륙 시작: ${currentRoom.land_start_fmt||fmt(currentRoom.land_start)}</div></div>
      </div>`:inTicket?'<div class="my-row"><div class="my-row-sub">착륙 시간에 버튼이 나타납니다</div></div>':''}
    </div>`; return;
  }

  if (beforeTicket) {
    el.innerHTML=`<div class="my-block"><div class="my-row" style="background:#F5F5F5">
      <div><div class="my-row-label" style="color:var(--text3)">⏳ 티켓팅 시작 전</div>
      <div class="my-row-sub">${currentRoom.ticket_start_fmt||fmt(currentRoom.ticket_start)} 부터 가능</div></div>

      <div class="my-row-sub" style="margin-top:4px">만료: ${me.warn_expires||'익일 10:00'} 이전에 경고 차감 필요</div>
    </div></div>`; return;
  }

  if (inTicket) {
    const ec=me?.excellent_count||0, hc=me?.honorary_count||0;

      ?`<span style="color:var(--green);font-weight:700">✅ 이번주 ${weekLandCount}일 착륙 완료 (필참 달성)</span>`

      <div style="padding:9px 14px;background:var(--bg);border-bottom:1px solid var(--border);font-size:12px">🛫 ${passMsg}</div>
      <div style="padding:14px;display:flex;flex-direction:column;gap:10px">
        <div>
          <div class="my-row-label" style="margin-bottom:5px">인스타그램 링크</div>
          <input class="input" id="inp-ticket-link" placeholder="https://instagram.com/p/..." autocomplete="off">
        </div>

            ${hc>0?`<option value="honorary">🏅 명예 탑승 (보유 ${hc}개) — 즉시 착륙, 주 2회 제외</option>`:''}

        <div class="my-row-sub" style="text-align:center">취소 불가 · 운영진/우수/명예는 즉시 착륙 처리</div>
      </div>
    </div>`; return;
  }

  el.innerHTML=`<div class="my-block"><div class="my-row" style="background:#F5F5F5">
    <div class="my-row-label" style="color:var(--text3)">🔒 티켓팅이 마감되었습니다</div>

async function doTicketFromUI() {
  const sel=document.getElementById('sel-ticket-type');
  const tt=sel?sel.value:'normal';
  await doTicket(tt);
}
async function doTicket(tt='normal') {
  if (!me?.member_id||!currentRoom) return;
  const li=document.getElementById('inp-ticket-link');
  const raw=(li?.value||'').trim();
  const url=extractUrl(raw);
  if (!url) { alert('인스타그램 링크를 찾을 수 없어요. 링크가 포함된 텍스트를 입력해주세요\n(카톡 등에서 복사한 설명글을 통째로 붙여넣어도 괜찮아요)'); li?.focus(); return; }
  const btn=document.querySelector('#my-part button[data-action="ticket"]');
  if (btn) { btn.disabled=true; btn.textContent='처리 중...'; }
  try {
    const instant=(tt==='excellent'||tt==='honorary'||tt==='staff');
    const td=await api('ticket',{
      room_id:currentRoom.room_id, member_id:me.member_id,
      nickname:me.nickname, insta_id:me.insta_id,
      ticket_type:tt, post_url:url
    });
    if (!td.ok) { alert(td.error||'탑승 실패'); return; }
    if (!instant) {
      await api('register_link',{room_id:currentRoom.room_id,member_id:me.member_id,post_url:url});
    }
    if (tt==='excellent') { me.excellent_count=Math.max(0,(me.excellent_count||0)-1); saveS(me); }
    if (tt==='honorary')  { me.honorary_count =Math.max(0,(me.honorary_count ||0)-1); saveS(me); }
    fly(); await goTicket(currentRoom.room_id);
  } catch(e) { alert('서버 오류'); }
  finally { if(btn){btn.disabled=false;} }
}
async function doRegisterLink(btn) {
  const raw=(document.getElementById('inp-link')?.value||'').trim();
  const url=extractUrl(raw);
  if (!url) { alert('올바른 링크를 찾을 수 없어요. 링크가 포함된 텍스트를 입력해주세요'); return; }
  if (btn) { btn.disabled=true; btn.textContent='등록 중...'; }
  try {
    const d=await api('register_link',{room_id:currentRoom.room_id,member_id:me.member_id,post_url:url});
    if (!d.ok) { alert(d.error||'실패'); return; }
    await goTicket(currentRoom.room_id);
  } catch(e) { alert('서버 오류'); }
  finally { if(btn){btn.disabled=false;btn.textContent='등록';} }
}
async function doUpdateLink(btn) {
  const raw=(document.getElementById('inp-link-edit')?.value||'').trim();
  const url=extractUrl(raw);
  if (!url) { alert('올바른 링크를 찾을 수 없어요. 링크가 포함된 텍스트를 입력해주세요'); return; }
  if (btn) { btn.disabled=true; btn.textContent='수정 중...'; }
  try {
    const d=await api('update_link',{room_id:currentRoom.room_id,member_id:me.member_id,post_url:url});
    if (!d.ok) { alert(d.error||'실패'); return; }
    await goTicket(currentRoom.room_id);
  } catch(e) { alert('서버 오류'); }
  finally { if(btn){btn.disabled=false;btn.textContent='수정';} }
}
async function doLand(btn) {
  if (!confirm('착륙 완료 처리하시겠습니까? 1회만 가능합니다.')) return;
  if (btn) { btn.disabled=true; btn.textContent='처리 중...'; }
  try {
    const d=await api('land',{room_id:currentRoom.room_id,member_id:me.member_id});
    if (!d.ok) { alert(d.error||'실패'); return; }
    await goTicket(currentRoom.room_id);
  } catch(e) { alert('서버 오류'); }
  finally { if(btn){btn.disabled=false;btn.textContent='착륙 ✓';} }
}
function copyAll() {
  if (!participants.length) { alert('참여자가 없습니다'); return; }
  const sorted=[...participants].sort((a,b)=>(a.ticket_at||'').localeCompare(b.ticket_at||''));
  const text=sorted.map((p,i)=>`${i+1}. ${p.nickname} @${p.insta_id}${p.post_url?' '+p.post_url:''}`).join('\n');
  navigator.clipboard.writeText(text)
    .then(()=>alert(`${sorted.length}명 복사 완료!`))
    .catch(()=>{ const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);alert(`${sorted.length}명 복사 완료!`); });
}
</script>
